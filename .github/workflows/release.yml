name: Draft release
on:
  push:
    tags:
      - '*.*.*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run release:prepare
      - name: Create draft with installation assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file CHANGELOG.md
          else
            gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --draft --title "WeekCraft $GITHUB_REF_NAME" --notes-file CHANGELOG.md
          fi
